<div class="request-info-container">
  <header class="header">
    <h1>Request Information</h1>
    <p>Have a question? Fill out the form below, and we'll get back to you with the information you need.</p>
  </header>

  <section class="form-section">
    <div class="form-container">
      <form class="request-form">
        <div class="form-group">
          <label for="email">Your Email</label>
          <input type="email" id="email" name="email" placeholder="Enter your email" required>
        </div>
        <div class="form-group">
          <label for="question">Your Question</label>
          <textarea id="question" name="question" placeholder="What information would you like to know?" required rows="5"></textarea>
        </div>
        <button type="submit" class="submit-button">Submit Request</button>
      </form>
    </div>
  </section>

</div>
