<div class="container">
  <header class="header fade-in">
    <h1>Frequently Asked Questions</h1>
    <p>Learn more about how No Bro makes renting simple, affordable, and transparent.</p>
  </header>

  <section class="faq-section fade-in">
    <h2>Your Questions, Answered</h2>
    <div class="faq-list">
      <div *ngFor="let faq of faqs; let i = index" class="faq-item slide-in" [ngClass]="{'open': faq.isOpen}">
        <div class="faq-question" (click)="toggleFaq(i)">
          <h3>{{ faq.question }}</h3>
          <i class="fas fa-chevron-down"></i>
        </div>
        <div class="faq-answer" *ngIf="faq.isOpen">
          <p>{{ faq.answer }}</p>
        </div>
      </div>
      <div *ngIf="!faqs.length" class="loader">Loading FAQs...</div>
    </div>
  </section>

  <section class="contact-section fade-in">
    <h2>Still Have Questions?</h2>
    <p>Contact our team in Bangalore, India, for personalized assistance.</p>
